name: Build Android APK

on:
  push:
    branches: [master, main]
  workflow_dispatch: # allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build web app
      - name: Build web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_AI_WORKER_URL: https://finfree-ai.finfree-ai.workers.dev

      # 5. Set up Java 17 (required for Android)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 6. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 7. Install Capacitor CLI
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli

      # 8. Sync Capacitor
      - name: Sync Capacitor Android
        run: npx cap sync android

      # 9. Make gradlew executable
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # 9b. Restore the fixed signing keystore so every APK has the SAME signature.
      # Without this, each runner generates a random debug key and Android refuses
      # to update the installed app ("package conflicts with an existing package").
      # Setup (one time): repo Settings → Secrets and variables → Actions →
      # New repository secret → name KEYSTORE_BASE64, value from the base64 file.
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/finfree.keystore
            echo "✅ Fixed signing keystore restored — APK updates will install in place"
          else
            echo "⚠️ KEYSTORE_BASE64 secret not set — APK will be signed with a random key and updates will require uninstalling first"
          fi

      # 10. Build Debug APK
      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      # 11. Upload APK as artifact (download from GitHub)
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinFree-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # 12. Show APK size
      - name: Show APK info
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          echo "✅ APK built successfully!"
